<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borang Laporan Penyelenggaraan</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    :root {
      --primary: #005A9C; 
      --secondary: #00A8E8; 
      --bg: #F0F8FF; 
      --white: #FFFFFF;
      --text: #333333;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--white);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 90, 156, 0.15);
      border-top: 6px solid var(--primary);
    }
    h2 {
      color: var(--primary);
      text-align: center;
      margin-top: 0;
      border-bottom: 2px solid var(--secondary);
      padding-bottom: 15px;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--primary);
    }
    .required {
      color: red;
    }
    input[type="date"],
    input[type="time"],
    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--secondary);
      outline: none;
      box-shadow: 0 0 5px rgba(0, 168, 232, 0.3);
    }
    .hidden {
      display: none;
      margin-top: 10px;
    }
    button.submit-btn {
      width: 100%;
      background-color: var(--primary);
      color: var(--white);
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-top: 10px;
    }
    button.submit-btn:hover {
      background-color: var(--secondary);
    }
    button.submit-btn:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    #loadingMessage {
      display: none;
      text-align: center;
      color: var(--primary);
      font-weight: bold;
      margin-top: 15px;
    }
    .water-accent {
      height: 4px;
      background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
      margin-bottom: 25px;
      border-radius: 2px;
    }

    /* --- GAYA POP-UP MODAL --- */
    .modal-overlay {
      display: none; 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 9999;
      justify-content: center; align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .modal-box {
      background: var(--white);
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      max-width: 100%;
      width: 450px;
      border-top: 5px solid var(--primary);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-box h3 { color: var(--primary); margin-top: 0; margin-bottom: 10px; }
    .modal-box p { color: var(--text); font-size: 15px; margin-bottom: 20px; line-height: 1.5; }
    .btn-ok {
      background-color: #cccccc;
      color: #333;
      border: none;
      padding: 10px 30px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
      width: 100%;
      margin-top: 5px;
    }
    .btn-ok:hover { background-color: #aaaaaa; }
    
    /* Butang Tindakan Custom */
    .btn-wa, .btn-copy {
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s;
      width: 100%;
      margin-bottom: 10px;
    }
    .btn-wa { background-color: #25D366; } /* Hijau WhatsApp */
    .btn-wa:hover { background-color: #128C7E; }
    
    .btn-copy { background-color: var(--primary); } /* Biru untuk Copy */
    .btn-copy:hover { background-color: var(--secondary); }
    
    #whatsappText {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
      margin-bottom: 15px;
      resize: vertical;
      font-family: monospace;
      text-align: left;
    }
    .turnstile-container {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Laporan Penyelenggaraan Sistem Bekalan Air</h2>
    <div class="water-accent"></div>
    
    <form id="waterForm" onsubmit="handleFormSubmit(event)">
      
      <!-- MAKLUMAT ASAS -->
      <div class="form-group">
        <label>Tarikh <span class="required">*</span></label>
        <input type="date" id="tarikh" required>
      </div>

      <div class="form-group">
        <label>Dilaksanakan Oleh <span class="required">*</span></label>
        <select id="dilaksanakanOleh" required onchange="checkOther('dilaksanakanOleh', 'dilaksanakanOlehOtherGroup')">
          <option value="" disabled selected>Pilih...</option>
          <option value="ASZAIDY & NAQIU">ASZAIDY & NAQIU</option>
          <option value="WAN & MUDSARIZAL">WAN & MUDSARIZAL</option>
          <option value="Other">Lain-lain (Nyatakan)</option>
        </select>
        <div id="dilaksanakanOlehOtherGroup" class="hidden">
          <input type="text" id="dilaksanakanOlehOther" placeholder="Sila nyatakan siapa...">
        </div>
      </div>

      <div class="form-group">
        <label>Masa Mula <span class="required">*</span></label>
        <input type="time" id="masaMula" required>
      </div>

      <div class="form-group">
        <label>Masa Siap <span class="required">*</span></label>
        <input type="time" id="masaSiap" required>
      </div>

      <!-- MAKLUMAT PENYELENGGARAAN & LOKASI -->
      <div class="form-group">
        <label>Kategori Penyelenggaraan <span class="required">*</span></label>
        <select id="kategori" required disabled>
          <option value="" disabled selected>Memuatkan pangkalan data...</option>
        </select>
      </div>

      <div class="form-group">
        <label>Jenis Penyelenggaraan <span class="required">*</span></label>
        <select id="jenisPenyelenggaraan" required disabled>
          <option value="" disabled selected>Sila pilih Kategori dahulu</option>
        </select>
      </div>

      <div class="form-group">
        <label>Zon <span class="required">*</span></label>
        <select id="zon" required disabled>
          <option value="" disabled selected>Sila pilih Jenis dahulu</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>Lokasi <span class="required">*</span></label>
        <select id="lokasi" required disabled>
          <option value="" disabled selected>Sila pilih Zon dahulu</option>
        </select>
      </div>

      <!-- MAKLUMAT TAMBAHAN & TINDAKAN -->
      <div class="form-group">
        <label>Saiz <span class="required">*</span></label>
        <select id="saiz" required onchange="checkOther('saiz', 'saizOtherGroup')">
          <option value="" disabled selected>Pilih...</option>
          <option value="1">1</option>
          <option value="1.5">1.5</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="6">6</option>
          <option value="8">8</option>
          <option value="10">10</option>
          <option value="12">12</option>
          <option value="14">14</option>
          <option value="15">15</option>
          <option value="18">18</option>
          <option value="20">20</option>
          <option value="21">21</option>
          <option value="24">24</option>
          <option value="30">30</option>
          <option value="36">36</option>
          <option value="40">40</option>
          <option value="48">48</option>
          <option value="Other">Lain-lain</option>
        </select>
        <div id="saizOtherGroup" class="hidden">
          <input type="text" id="saizOther" placeholder="Sila nyatakan saiz...">
        </div>
      </div>

      <div class="form-group">
        <label>Tindakan & Ulasan <span class="required">*</span></label>
        <textarea id="tindakan" rows="4" required placeholder="Sila masukkan laporan tindakan anda di sini..."></textarea>
      </div>

      <!-- Cloudflare Turnstile Widget -->
      <div class="turnstile-container">
        <div class="cf-turnstile" data-sitekey="0x4AAAAAAESbl_1xCMyEAc2x"></div>
      </div>

      <button type="submit" id="submitBtn" class="submit-btn" disabled>Sila tunggu...</button>
      <div id="loadingMessage">Sedang menyimpan data... Sila tunggu sebentar.</div>
    </form>
  </div>

  <!-- STRUKTUR MODAL BAHARU UNTUK WHATSAPP -->
  <div id="customModal" class="modal-overlay">
    <div class="modal-box">
      <h3 id="modalTitle">Status Laporan</h3>
      <p id="modalMessage">Mesej akan dipaparkan di sini.</p>
      
      <!-- Bahagian Copy & Link WhatsApp (Hanya muncul jika berjaya) -->
      <div id="copySection" style="display: none;">
        <textarea id="whatsappText" rows="12" readonly></textarea>
        
        <!-- Butang Link terus ke WhatsApp -->
        <button type="button" class="btn-wa" onclick="sendToWhatsApp()">Hantar Terus ke WhatsApp</button>
        
        <!-- Butang Copy Manual -->
        <button type="button" class="btn-copy" onclick="copyWhatsAppText()">Salin Mesej Sahaja (Copy)</button>
      </div>

      <button class="btn-ok" onclick="closeModal()">Tutup Borang</button>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://borangprv.sainspdwater.workers.dev/";
    let masterData = null;

    document.addEventListener("DOMContentLoaded", function() {
      fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "getLokasi" })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          initializeDropdowns(data.data);
        } else {
          showModal(data.message || "Gagal memuat turun data", "Ralat");
        }
      })
      .catch(error => {
        showModal("Ralat sambungan: Sila refresh muka surat.", "Ralat");
        document.getElementById("kategori").innerHTML = '<option value="" disabled selected>Gagal memuat turun data</option>';
      });
    });

    function initializeDropdowns(data) {
      if (!data) return; 
      masterData = data;
      
      const katSelect = document.getElementById("kategori");
      katSelect.innerHTML = `
        <option value="" disabled selected>Pilih Kategori...</option>
        <option value="BERJADUAL">BERJADUAL</option>
        <option value="TIDAK BERJADUAL">TIDAK BERJADUAL</option>
      `;
      katSelect.disabled = false;

      katSelect.addEventListener("change", handleKategoriChange);
      document.getElementById("jenisPenyelenggaraan").addEventListener("change", handleJenisChange);
      document.getElementById("zon").addEventListener("change", handleZonChange);

      document.getElementById("tarikh").addEventListener("change", function() {
        if (document.getElementById("kategori").value) {
           handleKategoriChange(); 
        }
      });

      var btn = document.getElementById("submitBtn");
      btn.disabled = false;
      btn.innerHTML = "Hantar Laporan";
    }

    function resetDropdown(id, defaultText) {
      const select = document.getElementById(id);
      select.innerHTML = `<option value="" disabled selected>${defaultText}</option>`;
      select.disabled = true;
    }

    function populateDropdown(id, optionsArray) {
      const select = document.getElementById(id);
      select.disabled = false;
      if (optionsArray.length === 0) {
         let el = document.createElement("option");
         el.value = "";
         el.text = "Tiada pilihan / Selesai";
         el.disabled = true;
         el.selected = true;
         select.add(el);
      } else {
         optionsArray.forEach(opt => {
           if (opt) {
             let el = document.createElement("option");
             el.value = opt;
             el.text = (id === "zon" && !String(opt).toLowerCase().includes("zon")) ? "Zon " + opt : opt;
             select.add(el);
           }
         });
      }
    }

    function getSelectedDateInfo() {
      var dateVal = document.getElementById("tarikh").value;
      if (!dateVal) return null;
      var months = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
      var parts = dateVal.split("-").map(Number);
      if (parts.length !== 3 || !parts[0] || !parts[1] || !parts[2]) return null;
      return {
        bulan: months[parts[1] - 1],
        tahun: parts[0]
      };
    }

    function normalizeTaskText(value) {
      return String(value || "")
        .normalize("NFKD")
        .replace(/[\u0300-\u036f]/g, "")
        .toUpperCase()
        .replace(/[’‘`]/g, "'")
        .replace(/\bBKT\b/g, "BUKIT")
        .replace(/\bTMN\b/g, "TAMAN")
        .replace(/\bSI\s+RUSA\b/g, "SIRUSA")
        .replace(/[^A-Z0-9]+/g, " ")
        .trim()
        .replace(/\s+/g, " ");
    }

    function normalizeLocation(value) {
      var location = normalizeTaskText(value);
      var aliases = {
        "PRV PERINDUSTRIAN PERDANA BUKIT PALONG": "PRV PERINDUSTRIAN BUKIT PALONG",
        "PRV TAMAN WAWASAN LUKUT MAKMUR": "PRV LUKUT MAKMUR"
      };
      return aliases[location] || location;
    }

    function isSameReportingYear(completedYear, selectedYear) {
      var completed = Number(completedYear);
      var selected = Number(selectedYear);
      if (completed === selected) return true;

      // Google Sheets can interpret a date entered as 7-06-26 as year 1926.
      // Match it to 2026 only when the last two digits are the same.
      return completed >= 1900 && completed < 2000 && selected >= 2000 &&
        completed % 100 === selected % 100;
    }

    function isTaskCompleted(task, dateInfo) {
      if (!masterData || !Array.isArray(masterData.completed)) return false;
      var taskLocation = normalizeLocation(task.lokasi);

      return masterData.completed.some(c =>
        normalizeLocation(c.lokasi) === taskLocation &&
        normalizeTaskText(c.bulan) === dateInfo.bulan &&
        isSameReportingYear(c.tahun, dateInfo.tahun)
      );
    }

    function getAvailableBerjadualTasks() {
      if (!masterData || !Array.isArray(masterData.schedule)) return [];
      var dateInfo = getSelectedDateInfo();
      if (!dateInfo) return []; 
      
      return masterData.schedule.filter(t => {
        if (normalizeTaskText(t.bulan) !== dateInfo.bulan) return false;
        return !isTaskCompleted(t, dateInfo);
      });
    }

    function getTidakBerjadualTasks() {
       if (!masterData) return [];
       return masterData.schedule;
    }

    function handleKategoriChange() {
      const kat = document.getElementById("kategori").value;
      
      if (kat === "BERJADUAL" && !document.getElementById("tarikh").value) {
         showModal("Sila isi ruangan Tarikh dahulu untuk melihat senarai Berjadual.", "Peringatan");
         document.getElementById("kategori").value = ""; 
         return;
      }

      resetDropdown("jenisPenyelenggaraan", "Pilih Jenis...");
      resetDropdown("zon", "Pilih Zon...");
      resetDropdown("lokasi", "Pilih Lokasi...");

      let select = document.getElementById("jenisPenyelenggaraan");
      select.disabled = false;
      select.innerHTML = `<option value="" disabled selected>Pilih Jenis...</option>`;

      let tasks = kat === "BERJADUAL" ? getAvailableBerjadualTasks() : getTidakBerjadualTasks();
      let jenisSet = new Set(tasks.map(t => t.jenis));
      populateDropdown("jenisPenyelenggaraan", Array.from(jenisSet).filter(Boolean));
    }

    function handleJenisChange() {
      const kat = document.getElementById("kategori").value;
      const jenis = document.getElementById("jenisPenyelenggaraan").value;
      resetDropdown("zon", "Pilih Zon...");
      resetDropdown("lokasi", "Pilih Lokasi...");

      let select = document.getElementById("zon");
      select.disabled = false;
      select.innerHTML = `<option value="" disabled selected>Pilih Zon...</option>`;

      let tasks = kat === "BERJADUAL" ? getAvailableBerjadualTasks() : getTidakBerjadualTasks();
      let filteredTasks = tasks.filter(t => t.jenis === jenis);
      
      let zonSet = new Set(filteredTasks.map(t => t.zon));
      let sortedZon = Array.from(zonSet).filter(Boolean).sort((a,b) => String(a).localeCompare(String(b), undefined, {numeric: true}));
      populateDropdown("zon", sortedZon);
    }

    function handleZonChange() {
      const kat = document.getElementById("kategori").value;
      const jenis = document.getElementById("jenisPenyelenggaraan").value;
      const zon = document.getElementById("zon").value;

      let select = document.getElementById("lokasi");
      select.disabled = false;
      select.innerHTML = `<option value="" disabled selected>Pilih Lokasi...</option>`;

      let tasks = kat === "BERJADUAL" ? getAvailableBerjadualTasks() : getTidakBerjadualTasks();
      let filteredTasks = tasks.filter(t => t.jenis === jenis && String(t.zon) === String(zon));
      
      // Set mengekalkan urutan asal baris Zon!N2:Q. Jangan susun semula abjad.
      let lokasiSet = new Set(filteredTasks.map(t => t.lokasi));
      populateDropdown("lokasi", Array.from(lokasiSet).filter(Boolean));
    }

    function checkOther(selectId, divId) {
      var selectBox = document.getElementById(selectId);
      var otherDiv = document.getElementById(divId);
      var otherInput = otherDiv.querySelector('input');
      
      if (selectBox.value === "Other") {
        otherDiv.style.display = "block";
        otherInput.required = true;
      } else {
        otherDiv.style.display = "none";
        otherInput.required = false;
        otherInput.value = "";
      }
    }

    // FUNGSI MEMBINA TEKS WHATSAPP
    function generateWhatsAppText(formObj) {
      let pelaksana = (formObj.dilaksanakanOleh === "Other") ? formObj.dilaksanakanOlehOther : formObj.dilaksanakanOleh;
      let saiz = (formObj.saiz === "Other") ? formObj.saizOther : formObj.saiz;
      let zonText = String(formObj.zon).toLowerCase().includes("zon") ? formObj.zon : "Zon " + formObj.zon;

      return `*Tarikh* - ${formObj.tarikh}
*Dilaksanakan Oleh*  - ${pelaksana}
*Masa Mula* - ${formObj.masaMula}
*Masa Siap* - ${formObj.masaSiap}
*Kategori Penyelenggaraan* - ${formObj.kategori}
*Jenis Penyelenggaraan* - ${formObj.jenisPenyelenggaraan}
*Zon* - ${zonText}
*Lokasi* - ${formObj.lokasi}
*Saiz* - ${saiz}
*Tindakan & Ulasan* - ${formObj.tindakan}`;
    }

    function showModal(message, title, waText = null) {
      document.getElementById("modalTitle").innerText = title || "Status";
      document.getElementById("modalMessage").innerText = message;
      
      let copySection = document.getElementById("copySection");
      if (waText) {
        document.getElementById("whatsappText").value = waText;
        copySection.style.display = "block";
      } else {
        copySection.style.display = "none";
      }

      document.getElementById("customModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("customModal").style.display = "none";
    }

    // FUNGSI COPY CLIPBOARD (MANUAL)
    function copyWhatsAppText() {
      let copyText = document.getElementById("whatsappText");
      copyText.select();
      copyText.setSelectionRange(0, 99999); 

      navigator.clipboard.writeText(copyText.value).then(() => {
        alert("Mesej telah disalin!");
      }).catch(err => {
        document.execCommand("copy");
        alert("Mesej telah disalin!");
      });
    }

    // FUNGSI BUKA TERUS KE WHATSAPP APP
    function sendToWhatsApp() {
      let text = document.getElementById("whatsappText").value;
      // encodeURIComponent memastikan simbol seperti 'enter' (new line) dan * dihantar ke URL dengan betul
      let encodedText = encodeURIComponent(text);
      // Membuka Pautan API rasmi WhatsApp
      window.open("https://wa.me/?text=" + encodedText, "_blank");
    }

    async function handleFormSubmit(event) {
      event.preventDefault(); 

      const turnstileToken = document.querySelector('[name="cf-turnstile-response"]').value;
      if (!turnstileToken) {
        showModal("Sila sahkan bahawa anda bukan bot pada widget Turnstile.", "Pengesahan Diperlukan");
        return;
      }
      
      document.getElementById("submitBtn").style.display = "none";
      document.getElementById("loadingMessage").style.display = "block";

      var formObject = {
        tarikh: document.getElementById("tarikh").value,
        dilaksanakanOleh: document.getElementById("dilaksanakanOleh").value,
        dilaksanakanOlehOther: document.getElementById("dilaksanakanOlehOther").value,
        masaMula: document.getElementById("masaMula").value,
        masaSiap: document.getElementById("masaSiap").value,
        kategori: document.getElementById("kategori").value,
        jenisPenyelenggaraan: document.getElementById("jenisPenyelenggaraan").value,
        zon: document.getElementById("zon").value,
        lokasi: document.getElementById("lokasi").value,
        saiz: document.getElementById("saiz").value,
        saizOther: document.getElementById("saizOther").value,
        tindakan: document.getElementById("tindakan").value
      };

      let whatsappMessage = generateWhatsAppText(formObject);

      try {
        // Ambil data paling baharu sebelum simpan supaya pilihan yang baru
        // diselesaikan oleh pengguna lain tidak dihantar sekali lagi.
        if (formObject.kategori === "BERJADUAL") {
          const latestResult = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "getLokasi" })
          });
          const latestPayload = await latestResult.json();
          if (!latestResult.ok || latestPayload.status !== "success") {
            throw new Error(latestPayload.message || "Tidak dapat menyemak rekod terkini.");
          }

          masterData = latestPayload.data;
          const isStillAvailable = getAvailableBerjadualTasks().some(task =>
            normalizeLocation(task.lokasi) === normalizeLocation(formObject.lokasi) &&
            normalizeTaskText(task.jenis) === normalizeTaskText(formObject.jenisPenyelenggaraan) &&
            String(task.zon) === String(formObject.zon)
          );

          if (!isStillAvailable) {
            showModal(
              "Lokasi ini sudah direkodkan untuk bulan yang dipilih. Sila pilih lokasi lain.",
              "Rekod Telah Wujud"
            );
            handleKategoriChange();
            return;
          }
        }

        const saveResult = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "saveData",
            formObject: formObject,
            turnstileToken: turnstileToken
          })
        });
        const response = await saveResult.json();
        if (!saveResult.ok || response.status === "error" || response.success === false) {
          throw new Error(response.message || "Pelayan gagal menyimpan rekod.");
        }

        showModal(response.message || "Rekod Telah Berjaya Disimpan!", "Berjaya", whatsappMessage);
        
        document.getElementById("waterForm").reset();
        
        resetDropdown("jenisPenyelenggaraan", "Sila pilih Kategori dahulu");
        resetDropdown("zon", "Sila pilih Jenis dahulu");
        resetDropdown("lokasi", "Sila pilih Zon dahulu");
        
        document.getElementById("dilaksanakanOlehOtherGroup").style.display = "none";
        document.getElementById("saizOtherGroup").style.display = "none";
      } catch (error) {
        showModal("Gagal menghantar borang: " + error.toString(), "Ralat");
      } finally {
        document.getElementById("submitBtn").style.display = "block";
        document.getElementById("loadingMessage").style.display = "none";

        if (typeof turnstile !== 'undefined') {
          turnstile.reset();
        }
      }
    }
  </script>
</body>
</html>
